# Builds the Windows version (and the Android app) and publishes a GitHub release. SauceStore picks
# the release up automatically.
#
# Two ways to start it:
#   - push a version tag:   git tag v0.1.0 && git push origin v0.1.0
#   - or on GitHub: Actions > Release > Run workflow, and type the version (v0.1.0)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if one already ran today"
        type: boolean
        default: false
      version:
        description: "Version to publish, like v0.1.0"
        required: true

permissions:
  actions: read
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  once-a-day:
    # Keeps GitHub's free 2,000 build minutes a month in budget: one release a day (days in UTC). To release again
    # today anyway, run this workflow by hand with "Release even if one already ran today" ticked.
    runs-on: ubuntu-latest
    steps:
      - name: Only one release a day
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?created=$(date -u +%Y-%m-%d)&status=success" --jq .total_count)
          if [ "$n" -gt 0 ]; then
            echo "::error::A release already ran today. To release again anyway, run it by hand with 'Release even if one already ran today' ticked."
            exit 1
          fi

  windows:
    needs: once-a-day
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-windows-templates

      - name: Install Godot and the Windows export templates
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/windows_release_x86_64.exe" ]; then
            mkdir -p "$T"
            curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
            unzip -o -j -q /tmp/templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe -d "$T"
            rm /tmp/templates.tpz
          fi

      - name: Set up rcedit (puts the game's icon into the .exe)
        run: |
          set -e
          sudo dpkg --add-architecture i386 >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 >/dev/null || sudo apt-get install -y -qq wine >/dev/null
          WINE=$(command -v wine64 || command -v wine)
          mkdir -p ~/tools
          curl -sSL -o ~/tools/rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          export WINEDEBUG=-all
          "$WINE" wineboot -i >/dev/null 2>&1 || true
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
              "export/windows/rcedit = \"$HOME/tools/rcedit.exe\"" \
              "export/windows/wine = \"$WINE\"" > ~/.config/godot/$f
          done
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"

      - name: Stamp the version number
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          V="${VERSION#v}"
          sed -i "s/^config\/version=.*/config\/version=\"$V\"/" project.godot
          grep config/version project.godot

      - name: Smoke test (play through Sector 1 automatically)
        run: |
          ~/godot/godot --headless --path . --import || true
          ~/godot/godot --headless --path . res://tests/smoke_test.tscn

      - name: Export the game
        run: |
          set -e
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/The13thSignal.exe
          test -s build/windows/The13thSignal.exe

      - name: Zip it up
        run: |
          set -e
          mkdir -p dist/zip/licenses
          cp build/windows/The13thSignal.exe dist/zip/
          cp licenses/* dist/zip/licenses/
          (cd dist/zip && zip -r -9 ../The13thSignal-windows.zip .)
          ls -la dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # SauceStore turns each line of the notes into its Version history.
          # Write them in release-notes/<version>.md; otherwise GitHub generates them.
          NOTES="release-notes/$VERSION.md"
          if [ -f "$NOTES" ]; then NOTE_ARGS=(--notes-file "$NOTES"); else NOTE_ARGS=(--generate-notes); fi
          gh release create "$VERSION" dist/The13thSignal-windows.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "The 13th Signal $VERSION" \
            "${NOTE_ARGS[@]}"

  # The Android app, attached to the same release once it's published.
  android:
    needs: windows
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      release: true
    secrets: inherit
