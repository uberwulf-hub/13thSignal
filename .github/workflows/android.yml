# Builds the Android version (an .apk you can install on a phone or tablet).
# Runs on its own from Actions > Android > Run workflow (the .apk is kept as a
# download on the run's page), and as part of every Release, which attaches it
# to the GitHub release as The13thSignal-android.apk.
#
# Signing: Android only installs an update over an older copy if both were
# signed with the same key, so the key must never change. It's handled for you:
# the key is kept in a private DRAFT release named "Android signing key". Drafts
# never expire and only people who can push to this repository can see them, so
# don't publish or delete it. (The first build that finds no stored key moves the
# key earlier builds kept in the Actions cache there, or makes a new one.)
# Optional: to use your own key instead, set these repository secrets
# (Settings > Secrets and variables > Actions); they take priority:
#   ANDROID_KEYSTORE_BASE64   the .keystore file, base64-encoded
#   ANDROID_KEYSTORE_ALIAS    the key's alias
#   ANDROID_KEYSTORE_PASSWORD its password
name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp, like v0.4.0 (leave empty to keep the current one)"
        required: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        description: "Attach the .apk to the GitHub release for this version"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and the Android export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-android-templates

      - name: Install Godot and the Android export templates
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/android_release.apk" ]; then
            mkdir -p "$T"
            curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
            unzip -o -j -q /tmp/templates.tpz templates/version.txt templates/android_release.apk templates/android_debug.apk -d "$T"
            rm /tmp/templates.tpz
          fi

      - name: Find the key earlier builds kept in the Actions cache (moved to the draft release below)
        uses: actions/cache/restore@v4
        with:
          path: ~/android-key
          key: the13thsignal-android-signing-key-v1

      - name: Set up signing and the Android SDK for Godot
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p ~/android-key
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > ~/android-key/release.keystore
            ALIAS="$KEY_ALIAS"; PASS="$KEY_PASS"
            echo "Using the signing key from the repository secrets."
          else
            KEY_TITLE="Android signing key (private - do not publish or delete)"
            REL=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .name == \"$KEY_TITLE\") | .id" | head -1)
            if [ -n "$REL" ]; then
              for f in release.keystore key.txt; do
                ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL/assets" --jq ".[] | select(.name == \"$f\") | .id")
                gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ID" > ~/android-key/$f
              done
              echo "Using the signing key kept in the private draft release."
            else
              if [ -f ~/android-key/release.keystore ]; then
                # The key earlier builds made (and kept in the cache): keep using it,
                # so phones that already have the game can still update.
                echo "the13thsignal the13thsignal" > ~/android-key/key.txt
                echo "Moving the cached signing key into a private draft release, to keep it for good."
              else
                NEWPASS=$(openssl rand -hex 16)
                keytool -genkeypair -v -keystore ~/android-key/release.keystore -alias the13thsignal \
                  -keyalg RSA -keysize 2048 -validity 10000 -storepass "$NEWPASS" -keypass "$NEWPASS" \
                  -dname "CN=The 13th Signal, O=uberwulf, C=US"
                echo "the13thsignal $NEWPASS" > ~/android-key/key.txt
                echo "::warning::Made a new signing key. Phones with an older copy must uninstall it before installing this one."
              fi
              gh release create android-signing-key --draft --repo "$GITHUB_REPOSITORY" \
                --title "$KEY_TITLE" \
                --notes "The key that signs the Android app. Every build uses it, so updates install over older copies. Keep this as a draft (only people who can push to the repository can see drafts). Don't publish or delete it." \
                ~/android-key/release.keystore ~/android-key/key.txt
            fi
            read -r ALIAS PASS < ~/android-key/key.txt
            keytool -list -keystore ~/android-key/release.keystore -storepass "$PASS" -alias "$ALIAS" | grep -i fingerprint || true
          fi
          keytool -genkeypair -keystore ~/android-key/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US" 2>/dev/null || true
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/android-key/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/android-key/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK: $SDK  Java: $JAVA_HOME"
          ls "$SDK/build-tools" | tail -3
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
              "export/android/android_sdk_path = \"$SDK\"" \
              "export/android/java_sdk_path = \"$JAVA_HOME\"" \
              "export/android/debug_keystore = \"$HOME/android-key/debug.keystore\"" \
              'export/android/debug_keystore_user = "androiddebugkey"' \
              'export/android/debug_keystore_pass = "android"' > ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Stamp the version number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          V="${VERSION#v}"
          if [ -z "$V" ]; then
            V=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          fi
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( ${MA:-1} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          sed -i "s/^config\/version=.*/config\/version=\"$V\"/" project.godot
          sed -i "s/^version\/name=.*/version\/name=\"$V\"/; s/^version\/code=.*/version\/code=$CODE/" export_presets.cfg
          echo "Version $V (code $CODE)"

      - name: Export the Android app
        run: |
          set -e
          ~/godot/godot --headless --path . --import || true
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" build/android/The13thSignal.apk 2>&1 | tee export.log
          test -s build/android/The13thSignal.apk
          cp build/android/The13thSignal.apk build/android/The13thSignal-android.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: The13thSignal-android
          path: build/android/The13thSignal-android.apk

      - name: Attach to the release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release upload "$VERSION" build/android/The13thSignal-android.apk --clobber --repo "$GITHUB_REPOSITORY"
